<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CampusCart</h1>
        <p>Campus Marketplace Management System</p>
    </header>

    <main>

        <div class="add-product">
            <h2>Add New Product</h2>

            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name">

            <label for="productPrice">Price</label>
            <input type="number" id="productPrice" placeholder="Enter price">

            <label for="productCategory">Category</label>
            <input type="text" id="productCategory" placeholder="Enter category">

            <label for="productDescription">Description</label>
            <input type="text" id="productDescription" placeholder="Enter description">

            <button onclick="addProduct()">Add Product</button>
        </div>

        <h2>Available Products</h2>

        <p id="productCount">Products Available: 0</p>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                onkeyup="searchProducts()">
        </div>

        <div id="productList"></div>

        <p id="noProducts"></p>

    </main>

    <button id="topButton" onclick="scrollToTop()">↑ Back to Top</button>

    <footer>
        <p>© 2026 CampusCart | Campus Marketplace Management System</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
